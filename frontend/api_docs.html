<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Документация API | DecisionTheory</title>
    <!-- Подключаем Bootstrap для базовых стилей -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключаем GitHub Markdown CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css" rel="stylesheet">
    <!-- Подключаем marked.js для рендеринга Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { padding-top: 50px; padding-bottom: 50px; background-color: #f8f9fa; color: #212529; }
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
            background-color: white;
            color: #212529 !important;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .markdown-body p, .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body li, .markdown-body strong {
            color: #212529 !important;
        }
        @media (max-width: 767px) {
            .markdown-body { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="btn btn-outline-secondary mb-3">&larr; На главную</a>
        <div id="content" class="markdown-body">
            <div class="text-center text-muted">
                <div class="spinner-border" role="status">
                  <span class="visually-hidden">Загрузка...</span>
                </div>
                <p>Загрузка документации...</p>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/docs/raw')
            .then(response => {
                if (!response.ok) {
                    throw new Error("HTTP error " + response.status);
                }
                return response.text();
            })
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `<div class="alert alert-danger">Ошибка загрузки документации: ${err.message}</div>`;
            });
    </script>
</body>
</html>

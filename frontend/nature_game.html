<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТПР — Игра с природой</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/input.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js"></script>
  <script src="js/nature_game.js" defer></script>
</head>
<body>
  <header>
    <h1>Игра с природой</h1>
    <p class="subtitle">Ввод данных, критерии оптимальности и расчет</p>
  </header>

  <main>
    <div class="page-nav">
      <button onclick="goHome()" class="nav-btn">Главная</button>
      <button onclick="goHistory()" class="nav-btn">История</button>
    </div>

    <section class="form-inner game-card" id="nature-game-form">
      <div class="game-header">
        <div>
          <h2>Общее правило</h2>
          <p class="muted">Матрица последствий (прибыль), состояния природы и критерии.</p>
        </div>
        <div class="game-actions">
          <select id="nature-example-select" class="select-input"></select>
          <button id="nature-example-btn" class="secondary-btn">Загрузить пример</button>
        </div>
      </div>

      <div class="grid two-cols">
        <div class="field">
          <label>Название ЛПР</label>
          <input type="text" id="decision-maker" placeholder="Лицо, принимающее решение">
        </div>
        <div class="field">
          <label>Коэффициент Гурвица (λ)</label>
          <input type="number" id="hurwicz-lambda" step="0.01" min="0" max="1" value="0.65">
        </div>
      </div>

      <div class="grid two-cols">
        <div class="field">
          <label>Вероятности состояний природы</label>
          <div id="probabilities-wrap" class="inline-inputs"></div>
        </div>
        <div class="field">
          <label>Подсказка</label>
          <div class="note">Вероятности можно оставить пустыми, если критерий Байеса не нужен.</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-group">
          <button id="add-row" class="secondary-btn">+ Стратегия</button>
          <button id="remove-row" class="secondary-btn">− Стратегия</button>
          <button id="add-col" class="secondary-btn">+ Состояние</button>
          <button id="remove-col" class="secondary-btn">− Состояние</button>
        </div>
      </div>

      <div class="table-wrap" id="nature-matrix-wrap"></div>

      <div class="footer-actions">
        <button id="nature-submit" class="primary-btn">Рассчитать</button>
        <span id="nature-status" class="status"></span>
      </div>
    </section>
  </main>
</body>
</html>

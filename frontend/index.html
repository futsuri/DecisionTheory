<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТПР — Выбор метода</title>
  <link rel="stylesheet" href="css/main.css">

    <link rel="stylesheet" href="css/style.css">

  <script src="js/common.js"></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <header>
    <h1>Теория Принятия Решений</h1>
    <p class="subtitle">Выберите метод для расчёта</p>
    <nav class="header-nav">
      <button onclick="goHistory()" class="nav-btn">История</button>
    </nav>
  </header>

  <main>
    <!-- Вставьте это внутрь тега <main> перед <div id="methods-container"> -->
    <section class="task-wizard-card">
        <h2>Мастер подбора решения</h2>
        <div class="wizard-step">
            <label><strong>1. Опишите вашу задачу кратко:</strong></label>
            <textarea id="task-text" placeholder="Например: построить ID3 по погоде, выбрать средство защиты, оценить риск запуска продукта..." class="wizard-input"></textarea>
        </div>

        <div class="wizard-step">
            <label><strong>2. Уточните условия (выберите все подходящие):</strong></label>
            <div class="check-grid">
                <label class="check-item">
                    <input type="checkbox" id="param-opponent">
                    <span>Есть активный оппонент / конкурент</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="param-uncertainty">
                    <span>Высокая неопределенность (погода, рынок)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="param-alternatives">
                    <span>Нужно выбрать один вариант из готового списка</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="param-criteria">
                    <span>Много противоречивых критериев (цена, качество, срок)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="param-opinion">
                    <span>Важно учесть мнение экспертов и их оценки</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="param-math">
                    <span>Есть готовые математические функции выгоды</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="param-fuzzy">
                    <span>Оценки размытые: низкий / средний / высокий, степени принадлежности</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="param-classification">
                    <span>Есть числовые показатели и понятные пороги для решения</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="param-id3">
                    <span>Есть таблица примеров с текстовыми признаками и известным итогом</span>
                </label>
            </div>
        </div>

        <button onclick="analyzeTaskAndRedirect()" class="nav-btn" style="width: 100%;">
            Подобрать оптимальный метод
        </button>
    </section>

    <div class="separator">
        <span>Или выберите метод вручную</span>
    </div>
    <div id="methods-container" class="methods-grid">
      <!-- заполнит JS -->
    </div>
  </main>
</body>
</html>
